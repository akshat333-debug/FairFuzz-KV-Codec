name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      
    - name: Install dependencies
      run: uv sync --all-extras --dev
      
    - name: Lint with ruff
      run: uv run ruff check .
      
    - name: Type check with mypy
      run: uv run mypy .
      
    - name: Test with pytest
      run: uv run pytest tests/ --cov=fairfuzzkv_codec

    # Performance REGRESSION guard (Prompt 18 item 126). These are loose
    # ceilings that catch order-of-magnitude regressions - they are guardrails,
    # not performance claims, and are run separately so a perf regression is
    # distinguishable from a correctness failure in the CI log.
    - name: Performance regression thresholds
      run: uv run pytest tests/systems -q -k "regression or large_context or load or fuzz"

