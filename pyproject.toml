[project]
name = "fairfuzzkv-codec"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Badampudi Agasthya Anirudh", email = "anirudhbadampudi@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "psutil>=7.2.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "regex>=2026.7.19",
    "scikit-learn>=1.9.0",
    "torch>=2.13.0",
    "transformers>=5.14.1",
    "typer>=0.27.0",
]

[project.scripts]
fairfuzzkv = "fairfuzzkv_codec.cli:app"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

# The import package is `fairfuzzkv_codec` regardless of the distribution
# name. Stated explicitly so the build never breaks if `[project] name` is
# changed (uv_build otherwise infers `src/<normalized-project-name>/`, which
# silently fails the build when the two diverge).
[tool.uv.build-backend]
module-name = "fairfuzzkv_codec"

[dependency-groups]
dev = [
    "coverage>=7.15.2",
    "hypothesis>=6.158.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
    "types-psutil>=7.2.2.20260518",
    "types-regex>=2026.7.19.20260720",
]

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true
